<text x='72.0' y='272.0' font-size='15' text-anchor='start' font-weight='normal' fill='#14202e' font-family='Helvetica, Arial, sans-serif'>2 × 2S 18650 packs</text>
<text x='72.0' y='293.0' font-size='15' text-anchor='start' font-weight='normal' fill='#14202e' font-family='Helvetica, Arial, sans-serif'>wired in series → 4S</text>
<text x='72.0' y='314.0' font-size='15' text-anchor='start' font-weight='normal' fill='#14202e' font-family='Helvetica, Arial, sans-serif'>12–16.8 V · XT30 × 2</text>
<rect x='420' y='180' width='360' height='230' rx='12' fill='#e7f1ff' stroke='#2b6cb0' stroke-width='2.2'/>
