<text x='56.0' y='878.0' font-size='14' text-anchor='start' font-weight='normal' fill='#56606d' font-family='Helvetica, Arial, sans-serif'>Sources: ModalAI REV4 compute diagram · bench session 2026-10-14 · owner hardware check 2026-10-20</text>
<text x='1544.0' y='878.0' font-size='14' text-anchor='end' font-weight='normal' fill='#56606d' font-family='Helvetica, Arial, sans-serif'>Starling 2 Max · modification stack</text>
