<text x='56.0' y='74.0' font-size='38' text-anchor='start' font-weight='bold' fill='#14202e' font-family='Helvetica, Arial, sans-serif'>The aircraft, and the five places you modify it</text>
<text x='56.0' y='110.0' font-size='20' text-anchor='start' font-weight='normal' fill='#56606d' font-family='Helvetica, Arial, sans-serif'>Every board on the Starling 2 Max and what connects them. Numbered boxes are the five workstreams.</text>
