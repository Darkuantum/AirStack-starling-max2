<text x='20.0' y='990.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>② LED chain (planned, orange): one data line, 16 px, a ring from the arm nearest the pads (rear-left): M2 → M3 → M1 → M4, skipping the crowded rear edge. If the pads turn out rear-right, mirror it. Each run starts ~12 mm out from the plate; 4 px = 67 mm.</text>
<text x='20.0' y='1006.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>Dashed = plain 3-wire return to the hub. Motor positions assume PX4 Quad X: confirm from CA_ROTOR* parameters.</text>
<text x='20.0' y='1026.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>Motors: PX4 Quad X numbering and spin (M1 FR CCW, M2 RL CCW, M3 FL CW, M4 RR CW). ESC ID → motor from VOXL_ESC_FUNC1–4 = 102,103,101,104. Verify spin against your props before relying on it.</text>
