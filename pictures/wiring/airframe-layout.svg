<text x='20.0' y='900.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>② LED chain (planned, orange): one data line, 16 px. ESC ⬇ OUT → arm FL px 0–3 → back to hub → FR 4–7 → RR 8–11 → RL 12–15.</text>
<text x='20.0' y='916.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>Each run starts ~12 mm out from the plate; 4 px × 16.7 mm = 67 mm. Dashed = plain 3-wire return to the hub. Order is a suggestion — fix it before soldering.</text>
<text x='20.0' y='940.0' font-size='12' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif'>Motors: PX4 Quad X numbering and spin (M1 FR CCW, M2 RL CCW, M3 FL CW, M4 RR CW). ESC ID → motor from VOXL_ESC_FUNC1–4 = 102,103,101,104 on both aircraft.</text>
